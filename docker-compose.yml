services:
  neo4j:
    image: neo4j:5-community
    container_name: ferticalc-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build: ./backend
    container_name: ferticalc-api
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - neo4j

  web:
    build: ./frontend
    container_name: ferticalc-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  neo4j_data:
  hf_cache:
